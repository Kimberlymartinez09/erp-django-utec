<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Ticket #{{ venta.id }}</title>
  <style>
    body { font-family: monospace; width: 300px; margin: 20px auto; }
    h2, p { text-align: center; margin: 4px 0; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    td, th { padding: 2px 0; font-size: 13px; }
    .right { text-align: right; }
    hr { border: none; border-top: 1px dashed #000; }
    @media print { button { display: none; } }
  </style>
</head>
<body>
  <h2>TICKET DE VENTA</h2>
  <p>N.º {{ venta.id }}</p>
  <p>{{ venta.fecha|date:"d/m/Y H:i" }}</p>
  <hr>
  <table>
    <tr><th>Producto</th><th class="right">Cant.</th><th class="right">Importe</th></tr>
    {% for item in venta.detalles.all %}
    <tr>
      <td>{{ item.producto }}</td>
      <td class="right">{{ item.cantidad }}</td>
      <td class="right">{{ item.subtotal }}</td>
    </tr>
    {% endfor %}
  </table>
  <hr>
  <p><strong>TOTAL: {{ venta.total }}</strong></p>
  <p>¡Gracias por su compra!</p>
  <button onclick="window.print()">Imprimir</button>
</body>
</html>
